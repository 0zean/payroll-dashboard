[project]
name = "payroll-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "aiohttp>=3.14.3",
    "reflex>=0.9.8",
    "reflex-calendar>=0.0.6",
    "reflex-components-core>=0.9.8",
    "reflex-components-radix>=0.9.7",
    "supabase==2.31.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "requests-mock>=1.12.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore:Config file.*not found.*:UserWarning"]
pythonpath = ["."]

[tool.ruff]
exclude = [".venv", "*.pyi"]
respect-gitignore = true
line-length = 120
lint.ignore = ["F403", "TRY002", "BLE001", "RUF012"]
