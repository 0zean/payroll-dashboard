[project]
name = "payroll-dashboard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.8"
dependencies = [
    "aiohttp>=3.13.5",
    "reflex>=0.9.2",
    "reflex-calendar>=0.0.6",
    "reflex-components-core>=0.9.2",
    "reflex-components-radix>=0.9.2",
    "supabase==2.30.0",
]

[dependency-groups]
dev = [
    "aioresponses>=0.7.8",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "requests-mock>=1.12.1",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
filterwarnings = ["ignore:Config file.*not found.*:UserWarning"]

[tool.ruff]
exclude = [".venv"]
respect-gitignore = true
line-length = 120
lint.ignore = ["F403"]
